<title>Guia de Materialismo Histórico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Conceito: caderno de estudo com duas formas de entrar: roteiro em módulos (sequência) e índice livre.
   Cada módulo tem uma cor própria, usada em pontos, barras e mapa de ligações. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --ink: #1c2230; --muted: #5a6479; --line: #dde1ea; --soft: #eceff5;
  --accent: #2d4aa0; --accent-ink: #ffffff; --mark: #fff3c9; --mark-ink: #6b5200;
  --epist: #2b6cb0; --econ: #c4661a; --soc: #2f8a57; --grams: #7b50b3; --org: #1c8a8a; --hist: #bf3b30; --br: #a8780f;
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read: "Newsreader", Georgia, "Times New Roman", serif;
  --top: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141b; --surface: #181c25; --ink: #e5e8f0; --muted: #98a2b8; --line: #2a3040; --soft: #1f2430;
    --accent: #93acf2; --accent-ink: #11141b; --mark: #3a3216; --mark-ink: #f1d98a;
    --epist: #6aa8ea; --econ: #e8924a; --soc: #5cc08a; --grams: #b194e6; --org: #4fc4c4; --hist: #ee7b70; --br: #e0b24d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141b; --surface: #181c25; --ink: #e5e8f0; --muted: #98a2b8; --line: #2a3040; --soft: #1f2430;
  --accent: #93acf2; --accent-ink: #11141b; --mark: #3a3216; --mark-ink: #f1d98a;
  --epist: #6aa8ea; --econ: #e8924a; --soc: #5cc08a; --grams: #b194e6; --org: #4fc4c4; --hist: #ee7b70; --br: #e0b24d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 40; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.th-epist { --c: var(--epist); } .th-econ { --c: var(--econ); } .th-soc { --c: var(--soc); } .th-grams { --c: var(--grams); }
.th-org { --c: var(--org); } .th-hist { --c: var(--hist); } .th-br { --c: var(--br); } .th- { --c: var(--muted); }

/* topo */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top); display: flex; align-items: center; gap: 12px;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-weight: 600; text-decoration: none; color: var(--ink); white-space: nowrap; letter-spacing: -0.01em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 8px; }
.brand .short { display: none; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; display: inline-grid; place-items: center; }
#menuBtn { display: none; }
.search { position: relative; flex: 1; max-width: 460px; margin-left: auto; }
.search input { width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 0 12px; font: inherit; }
.drop { position: absolute; left: 0; right: 0; top: 42px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(10,16,32,.18); max-height: 70vh; overflow: auto; padding: 4px; }
.drop a { display: block; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--ink); }
.drop a:hover, .drop a.on { background: var(--soft); }
.drop small { color: var(--muted); display: block; }

/* estrutura */
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr) 280px; min-height: calc(100vh - var(--top)); }
.side { border-right: 1px solid var(--line); background: var(--surface); position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--top) - env(safe-area-inset-top, 0px)); overflow: auto; padding: 14px 12px 40px; padding-left: max(12px, env(safe-area-inset-left, 0px)); }
.main { min-width: 0; padding: 28px 32px 80px; }
.rail { padding: 28px 16px 80px 0; padding-right: max(16px, env(safe-area-inset-right, 0px)); position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--top) - env(safe-area-inset-top, 0px)); overflow: auto; }

/* barra lateral */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--soft); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
.tabs button { border: 0; background: transparent; border-radius: 8px; padding: 7px 8px; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(10,16,32,.12); }
.mod { margin: 2px 0 6px; }
.mod > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.mod > summary::-webkit-details-marker { display: none; }
.mod > summary:hover { background: var(--soft); }
.letter { width: 24px; height: 24px; border-radius: 6px; background: var(--c); color: var(--surface); display: inline-grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
.mod .cnt { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.steps { list-style: none; margin: 2px 0 6px 0; padding: 0 0 0 20px; border-left: 2px solid var(--line); margin-left: 19px; }
.steps a { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 14px; }
.steps a:hover { background: var(--soft); }
.steps a[aria-current="page"] { background: var(--soft); font-weight: 600; box-shadow: inset 2px 0 0 var(--c); }
.steps .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.4em; font-size: 12px; }
.steps .ok { color: var(--c); font-weight: 600; min-width: 1.4em; font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.list { list-style: none; margin: 0; padding: 0; }
.list a { display: flex; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 14px; }
.list a:hover { background: var(--soft); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.list .st { margin-left: auto; font-size: 11px; color: var(--muted); }

/* início */
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
h1.page { font-size: clamp(1.9rem, 4.2vw, 2.7rem); line-height: 1.1; letter-spacing: -0.025em; margin: 6px 0 10px; font-weight: 600; text-wrap: balance; }
.lede { font-family: var(--read); font-size: 1.2rem; line-height: 1.55; max-width: 62ch; color: var(--ink); margin: 0 0 18px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 28px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 9px; padding: 10px 16px; font-weight: 500; text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card:hover { border-color: var(--c); }
.card h3 { margin: 0; font-size: 1.05rem; line-height: 1.25; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.card .row { display: flex; align-items: center; gap: 10px; }
.bar { height: 5px; background: var(--soft); border-radius: 3px; overflow: hidden; margin-top: auto; }
.bar i { display: block; height: 100%; background: var(--c); }
.meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.notice { background: var(--mark); color: var(--mark-ink); border-radius: 10px; padding: 12px 14px; margin: 24px 0 0; max-width: 70ch; font-size: 14px; }
.legend { display: grid; gap: 6px; font-size: 14px; color: var(--muted); max-width: 70ch; margin-top: 8px; }
h2.sec { font-size: 1.1rem; margin: 34px 0 12px; letter-spacing: -0.01em; }

/* nota */
.ribbon { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 22px; font-size: 14px; }
.ribbon .letter { width: 22px; height: 22px; }
.ribbon .prog { flex: 1; min-width: 80px; height: 5px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.ribbon .prog i { display: block; height: 100%; background: var(--c); }
.ribbon .arrows { display: flex; gap: 6px; margin-left: auto; }
.ribbon .arrows a, .ribbon .arrows span { border: 1px solid var(--line); border-radius: 7px; padding: 3px 10px; text-decoration: none; color: var(--ink); }
.ribbon .arrows span { color: var(--muted); opacity: .5; }
.crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.tag { font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.tag.th { color: var(--c); border-color: var(--c); }
h1.note { font-size: clamp(1.7rem, 3.6vw, 2.35rem); line-height: 1.12; letter-spacing: -0.022em; margin: 4px 0 18px; font-weight: 600; text-wrap: balance; }
.prose { font-family: var(--read); font-size: 1.1rem; line-height: 1.68; max-width: 68ch; overflow-wrap: anywhere; }
.prose h2 { font-family: var(--ui); font-size: 1.2rem; line-height: 1.25; letter-spacing: -0.01em; margin: 2.1em 0 .6em; scroll-margin-top: calc(var(--top) + 16px); }
.prose h3 { font-family: var(--ui); font-size: 1.02rem; margin: 1.6em 0 .4em; scroll-margin-top: calc(var(--top) + 16px); }
.prose p { margin: 0 0 1em; }
.prose ul, .prose ol { padding-left: 1.4em; margin: 0 0 1em; }
.prose li { margin: .25em 0; }
.prose li.todo, .prose li.done { list-style: none; margin-left: -1.2em; }
.prose li.todo::before { content: "☐ "; color: var(--muted); }
.prose li.done::before { content: "☑ "; color: var(--soc); }
.prose blockquote { margin: 1.1em 0; padding: 2px 0 2px 16px; border-left: 3px solid var(--line); color: var(--ink); }
.prose blockquote p { margin: 0 0 .5em; }
.prose blockquote p:last-child { font-family: var(--ui); font-size: .82rem; color: var(--muted); line-height: 1.45; }
.prose code { font-size: .88em; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.tw { overflow-x: auto; margin: 0 0 1.2em; max-width: 100%; }
.prose table { border-collapse: collapse; font-family: var(--ui); font-size: .88rem; min-width: 100%; }
.prose th, .prose td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.prose th { color: var(--muted); font-weight: 500; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
a.wl { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset: 3px; }
a.wl:hover { text-decoration-color: var(--accent); }
.wl-miss, .wl-pdf { border-bottom: 1px dotted var(--muted); color: var(--muted); cursor: help; }
em.tbc { font-family: var(--ui); font-style: normal; font-size: .72em; font-weight: 500; background: var(--mark); color: var(--mark-ink); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
em.mine { font-family: var(--ui); font-style: normal; font-size: .72em; font-weight: 500; background: var(--soft); color: var(--muted); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.callout { font-family: var(--ui); font-size: .92rem; line-height: 1.5; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 0 0 1.4em; }
.callout p { margin: .4em 0 0; }
.callout > summary { cursor: pointer; font-weight: 500; color: var(--muted); }
.callout .ch { font-weight: 600; margin-bottom: 2px; }
.callout.c-question { border-color: var(--grams); }
.callout.c-warning { border-color: var(--econ); }
.callout.c-question .ch { color: var(--grams); } .callout.c-warning .ch { color: var(--econ); }
.stepnav { display: flex; gap: 10px; flex-wrap: wrap; margin: 40px 0 8px; max-width: 68ch; }
.stepnav .btn { flex: 1 1 180px; justify-content: center; }
.stepnav small { display: block; color: inherit; opacity: .75; font-weight: 400; }
.conn { margin-top: 36px; max-width: 68ch; }
.conn h2 { font-size: 1rem; margin: 0 0 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; gap: 7px; align-items: center; padding: 5px 11px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; text-decoration: none; color: var(--ink); font-size: 14px; }
.pill:hover { border-color: var(--c); }

/* trilha lateral direita */
.rail h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.outline { list-style: none; margin: 0 0 24px; padding: 0; font-size: 14px; }
.outline a { display: block; padding: 3px 0 3px 10px; border-left: 2px solid var(--line); text-decoration: none; color: var(--muted); }
.outline a:hover { color: var(--ink); border-color: var(--accent); }
.graph { width: 100%; height: auto; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.outline-link { font-size: 14px; color: var(--muted); text-decoration: none; }
.outline-link:hover { color: var(--ink); }
.graph text { fill: var(--ink); font-family: var(--ui); font-size: 12px; }
.graph a:hover text { text-decoration: underline; }
.graph a { cursor: pointer; }
.graph line { stroke: var(--line); stroke-width: 1.2; }
.graph .c { fill: var(--c); }
.graph .ring { fill: var(--surface); stroke: var(--c); stroke-width: 2; }
.small-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.result { display: block; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; max-width: 70ch; }
.result:hover { border-color: var(--c); }
.result b { font-size: 1.02rem; }
.result p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.foot { margin-top: 60px; font-size: 12px; color: var(--muted); }

@media (max-width: 1180px) {
  .app { grid-template-columns: 280px minmax(0, 1fr); }
  .rail { position: static; height: auto; grid-column: 2; padding: 0 32px 60px; overflow: visible; }
}
@media (max-width: 820px) {
  #menuBtn { display: inline-grid; }
  .brand small, .brand .full { display: none; }
  .brand .short { display: inline; }
  .search { margin-left: 0; min-width: 0; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 35; left: 0; top: calc(var(--top) + env(safe-area-inset-top, 0px)); bottom: 0; height: auto; width: min(340px, 88vw); transform: translateX(-102%); visibility: hidden; transition: transform .18s ease, visibility 0s linear .18s; }
  body.menu .side { transform: none; visibility: visible; transition-delay: 0s; box-shadow: 8px 0 30px rgba(10,16,32,.25); }
  .main { padding: 20px 16px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .rail { grid-column: 1; padding: 0 16px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .prose { font-size: 1.06rem; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .side { transition: none; } }
</style>

<header class="top">
  <button class="icon-btn" id="menuBtn" aria-label="Abrir menu" aria-expanded="false">☰</button>
  <a class="brand" href="#inicio"><span class="full">Guia de Materialismo Histórico</span><span class="short">Guia</span><small>caderno de estudo</small></a>
  <div class="search">
    <input id="q" type="search" placeholder="Buscar em todas as notas" autocomplete="off" aria-label="Buscar em todas as notas">
    <div class="drop" id="drop" hidden></div>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="Alternar tema claro e escuro" title="Alternar tema"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 2a7 7 0 0 1 0 14z" fill="currentColor"/></svg></button>
</header>
<div class="app">
  <nav class="side" id="side" aria-label="Navegação"></nav>
  <main class="main" id="main" tabindex="-1"></main>
  <aside class="rail" id="rail" aria-label="Nesta nota"></aside>
</div>

<script>
const DATA = /*__DATA__*/null;
(function () {
  const NOTES = DATA.notes, MODS = DATA.mods;
  const byId = {}; NOTES.forEach(n => byId[n.id] = n);
  const modById = {}; MODS.forEach(m => modById[m.id] = m);
  const KIND = { conceito: "Conceito", obra: "Obra", autor: "Autor", corrente: "Corrente", guia: "Guia", fonte: "Fontes", nota: "Nota" };
  const mem = {};
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? (k in mem ? mem[k] : d) : JSON.parse(v); } catch (e) { return k in mem ? mem[k] : d; } },
    set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  let read = new Set(store.get("mh.read", []));
  let ctx = store.get("mh.ctx", "a");
  let last = store.get("mh.last", "");
  let tab = store.get("mh.tab", "roteiro");
  let kindFilter = "";
  let lastQuery = "";
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const deacc = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const saveRead = () => store.set("mh.read", Array.from(read));
  const theme = n => "th-" + (n.th || "");
  const modsOf = id => MODS.filter(m => m.s.includes(id));

  /* ---------- barra lateral ---------- */
  function renderSide(curId) {
    let h = `<div class="tabs" role="tablist"><button role="tab" data-tab="roteiro" aria-selected="${tab === "roteiro"}">Roteiro</button><button role="tab" data-tab="notas" aria-selected="${tab === "notas"}">Todas as notas</button></div>`;
    if (tab === "roteiro") {
      h += MODS.map(m => {
        const done = m.s.filter(i => read.has(i)).length;
        const open = (ctx === m.id) || m.s.includes(curId);
        return `<details class="mod th-${m.th}" ${open ? "open" : ""} data-mod="${m.id}"><summary><span class="letter">${m.l}</span><span>${esc(m.t)}</span><span class="cnt">${done}/${m.s.length}</span></summary>
        <ol class="steps">${m.s.map((id, i) => `<li><a href="#${id}" data-ctx="${m.id}" ${id === curId && ctx === m.id ? 'aria-current="page"' : ""}>${read.has(id) ? '<span class="ok">✓</span>' : `<span class="n">${i + 1}</span>`}<span>${esc(byId[id].t)}</span></a></li>`).join("")}</ol></details>`;
      }).join("");
      h += `<p class="small-note" style="padding:6px 8px">Todas as notas continuam acessíveis na aba ao lado, na busca e pelos links dentro do texto.</p>`;
    } else {
      const kinds = [["", "Todas"], ["conceito", "Conceitos"], ["obra", "Obras"], ["autor", "Autores"], ["corrente", "Correntes"], ["guia", "Guias"]];
      h += `<div class="chips">${kinds.map(([k, l]) => `<button class="chip" data-kind="${k}" aria-pressed="${kindFilter === k}">${l}</button>`).join("")}</div>`;
      const list = NOTES.filter(n => !kindFilter || n.k === kindFilter).slice().sort((a, b) => a.t.localeCompare(b.t, "pt"));
      h += `<ul class="list">${list.map(n => `<li><a class="${theme(n)}" href="#${n.id}"><span class="dot"></span><span>${esc(n.t)}</span>${n.stub ? '<span class="st">esboço</span>' : ""}</a></li>`).join("")}</ul>`;
    }
    $("side").innerHTML = h;
  }

  /* ---------- início ---------- */
  function nextStep() {
    const m = modById[ctx] || MODS[0];
    const un = m.s.find(i => !read.has(i));
    if (un) return { id: un, mod: m.id };
    for (const mm of MODS) { const u = mm.s.find(i => !read.has(i)); if (u) return { id: u, mod: mm.id }; }
    return { id: MODS[0].s[0], mod: MODS[0].id };
  }
  function renderHome() {
    const nx = nextStep();
    const started = read.size > 0 || last;
    const total = NOTES.length, conc = NOTES.filter(n => n.k === "conceito").length, obras = NOTES.filter(n => n.k === "obra").length;
    $("main").innerHTML = `
      <div class="eyebrow">Caderno de estudo · versão de teste</div>
      <h1 class="page">Materialismo histórico e economia política, em notas ligadas</h1>
      <p class="lede">Um guia de base para estudar em grupo: dos fundamentos de Marx e Engels à economia política, a Gramsci, a Lênin, Lukács e Rosa Luxemburgo, e à história do século XX de Hobsbawm. Cada nota diz o que leu, de onde vem e o que ainda falta conferir.</p>
      <div class="cta">
        <a class="btn primary" href="#${nx.id}" data-ctx="${nx.mod}">${started ? "Continuar: " + esc(byId[nx.id].t) : "Começar pelo roteiro"}</a>
        <a class="btn" href="#${byId[ids("Questões em aberto")] ? ids("Questões em aberto") : "inicio"}">Perguntas para discutir em grupo</a>
      </div>
      <h2 class="sec" style="margin-top:8px">Dois jeitos de ler</h2>
      <div class="legend">
        <div><b style="color:var(--ink)">Em sequência.</b> Os sete módulos abaixo ordenam as notas do mais básico ao mais específico, com “anterior” e “próximo” em cada nota, e guardam o que você já leu neste navegador.</div>
        <div><b style="color:var(--ink)">Livre.</b> Qualquer nota abre direto: pela busca, pela aba “Todas as notas” ou pelos links dentro do texto. Cada nota mostra o mapa das suas ligações.</div>
      </div>
      <h2 class="sec">Roteiro em módulos</h2>
      <div class="cards">${MODS.map(m => {
        const done = m.s.filter(i => read.has(i)).length;
        return `<a class="card th-${m.th}" href="#roteiro-${m.id}"><div class="row"><span class="letter">${m.l}</span><h3>${esc(m.t)}</h3></div><p>${esc(m.d)}</p><div class="meta">${m.s.length} notas · ${done} lidas</div><div class="bar"><i style="width:${Math.round(100 * done / m.s.length)}%"></i></div></a>`;
      }).join("")}</div>
      <h2 class="sec">Como ler as marcas</h2>
      <div class="legend">
        <div><em class="tbc">(conferir)</em> afirmação de memória ou de leitura ainda não conferida na sua edição.</div>
        <div><em class="mine">(leitura minha)</em> interpretação de quem montou o caderno, para discutir, não resultado da fonte.</div>
        <div><span class="wl-miss">texto pontilhado</span> remete a uma nota ou arquivo que não está nesta versão online.</div>
      </div>
      <div class="notice"><b>Versão de teste.</b> Muitas citações vêm de páginas lidas por ferramenta e ainda não têm o número de página da edição impressa. Antes de citar em trabalho, confira no texto original.</div>
      <p class="foot">${total} notas (${conc} conceitos, ${obras} obras) · gerado em ${DATA.built} a partir do cofre de estudos.</p>`;
    $("rail").innerHTML = "";
  }
  function ids(t) { const n = NOTES.find(x => x.t === t); return n ? n.id : ""; }

  /* ---------- módulo ---------- */
  function renderModule(mid) {
    const m = modById[mid]; if (!m) return renderHome();
    ctx = mid; store.set("mh.ctx", ctx);
    const done = m.s.filter(i => read.has(i)).length;
    $("main").innerHTML = `<div class="th-${m.th}">
      <div class="eyebrow">Módulo ${m.l}</div>
      <h1 class="page" style="margin-bottom:6px">${esc(m.t)}</h1>
      <p class="lede" style="font-size:1.1rem">${esc(m.d)}</p>
      <div class="meta" style="margin-bottom:14px">${done} de ${m.s.length} lidas</div>
      <div class="bar" style="max-width:420px;margin-bottom:22px"><i style="width:${Math.round(100 * done / m.s.length)}%"></i></div></div>
      ${m.s.map((id, i) => { const n = byId[id]; return `<a class="result th-${m.th}" href="#${id}" data-ctx="${m.id}"><span class="meta">${i + 1} · ${KIND[n.k]} ${read.has(id) ? "· ✓ lida" : ""}</span><br><b>${esc(n.t)}</b>${n.bl ? `<p>${esc(n.bl.length > 190 ? n.bl.slice(0, 187) + "…" : n.bl)}</p>` : ""}</a>`; }).join("")}`;
    $("rail").innerHTML = "";
  }

  /* ---------- nota ---------- */
  function neighbours(n) {
    const outs = n.o.filter(i => byId[i]);
    const ins = NOTES.filter(x => x.o.includes(n.id)).map(x => x.id);
    return { outs, ins };
  }
  function graph(n) {
    const { outs, ins } = neighbours(n);
    const set = []; const dir = {};
    outs.concat(ins).forEach(i => { if (!(i in dir)) { dir[i] = 0; set.push(i); } });
    outs.forEach(i => dir[i] |= 1); ins.forEach(i => dir[i] |= 2);
    const shown = set.slice(0, 14);
    if (!shown.length) return `<p class="small-note">Esta nota ainda não tem ligações.</p>`;
    const cx = 320, cy = 165, rx = 165, ry = 115, W = 640, H = 330;
    let s = "", g = "";
    shown.forEach((id, i) => {
      const a = -Math.PI / 2 + (2 * Math.PI * i) / shown.length;
      const co = Math.cos(a), x = cx + rx * co, y = cy + ry * Math.sin(a);
      const nn = byId[id];
      const mid = Math.abs(co) < 0.25, right = co >= 0;
      const lab = nn.t.length > 21 ? nn.t.slice(0, 20) + "…" : nn.t;
      const tx = mid ? x : x + (right ? 11 : -11), ty = mid ? (Math.sin(a) < 0 ? y - 12 : y + 20) : y + 4;
      s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
      g += `<a href="#${id}" class="${theme(nn)}"><circle class="c" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"/><text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${mid ? "middle" : right ? "start" : "end"}">${esc(lab)}</text><title>${esc(nn.t)}${dir[id] === 3 ? " (ligação nos dois sentidos)" : dir[id] === 1 ? " (esta nota cita)" : " (cita esta nota)"}</title></a>`;
    });
    const more = set.length > shown.length ? `<p class="small-note">Mostrando ${shown.length} de ${set.length} ligações; as demais estão nas listas abaixo.</p>` : "";
    return `<svg class="graph ${theme(n)}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de ligações de ${esc(n.t)}"><g>${s}</g><circle class="ring" cx="${cx}" cy="${cy}" r="10"/>${g}</svg>${more}`;
  }
  function renderNote(id) {
    const n = byId[id]; if (!n) return renderHome();
    last = id; store.set("mh.last", last);
    let m = modById[ctx];
    if (!m || !m.s.includes(id)) { const ms = modsOf(id); m = ms[0] || null; if (m && m.s.includes(id)) { ctx = m.id; store.set("mh.ctx", ctx); } }
    const inMod = m && m.s.includes(id);
    const idx = inMod ? m.s.indexOf(id) : -1;
    const prev = inMod && idx > 0 ? byId[m.s[idx - 1]] : null;
    const next = inMod && idx < m.s.length - 1 ? byId[m.s[idx + 1]] : null;
    const done = inMod ? m.s.filter(i => read.has(i)).length : 0;
    const isRead = read.has(id);
    const { outs, ins } = neighbours(n);
    const ribbon = inMod ? `<div class="ribbon th-${m.th}"><span class="letter">${m.l}</span><a href="#roteiro-${m.id}" style="color:var(--ink);text-decoration:none"><b>${esc(m.t)}</b> · passo ${idx + 1} de ${m.s.length}</a><div class="prog"><i style="width:${Math.round(100 * done / m.s.length)}%"></i></div>
        <div class="arrows">${prev ? `<a href="#${prev.id}" title="${esc(prev.t)}">← Anterior</a>` : "<span>← Anterior</span>"}${next ? `<a href="#${next.id}" title="${esc(next.t)}">Próximo →</a>` : "<span>Próximo →</span>"}</div></div>` : "";
    const others = modsOf(id).filter(x => !inMod || x.id !== m.id);
    const pills = arr => `<div class="pills">${arr.map(i => `<a class="pill ${theme(byId[i])}" href="#${i}"><span class="dot"></span>${esc(byId[i].t)}</a>`).join("")}</div>`;
    $("main").innerHTML = `${ribbon}
      <article class="${theme(n)}">
      <div class="crumbs"><span class="tag th">${KIND[n.k]}</span>${n.stub ? '<span class="tag">esboço</span>' : ""}${others.map(x => `<a class="tag" style="text-decoration:none" href="#roteiro-${x.id}">Também no módulo ${x.l}</a>`).join("")}</div>
      <h1 class="note">${esc(n.t)}</h1>
      <div class="prose" id="prose">${n.h}${n.stub ? '<p><em class="mine">Esta nota é um esboço; ainda não foi estudada em profundidade.</em></p>' : ""}</div>
      </article>
      ${inMod ? `<div class="stepnav th-${m.th}">
        ${prev ? `<a class="btn" href="#${prev.id}"><span>← Anterior<small>${esc(prev.t)}</small></span></a>` : ""}
        <button class="btn" id="readBtn" type="button">${isRead ? "✓ Lida (desmarcar)" : "Marcar como lida"}</button>
        ${next ? `<a class="btn primary" href="#${next.id}" id="nextBtn"><span>Concluir e seguir →<small>${esc(next.t)}</small></span></a>` : `<a class="btn primary" href="#roteiro-${m.id}">Fim do módulo</a>`}
      </div>` : ""}
      ${outs.length || ins.length ? `<section class="conn" id="conn"><h2>Mapa de ligações</h2>${graph(n)}${outs.length ? `<h2 style="margin-top:20px">Esta nota cita</h2>${pills(outs)}` : ""}${ins.length ? `<h2 style="margin-top:18px">Citada por</h2>${pills(ins)}` : ""}</section>` : ""}`;
    const rb = $("readBtn");
    if (rb) rb.addEventListener("click", () => { if (read.has(id)) read.delete(id); else read.add(id); saveRead(); renderSide(id); rb.textContent = read.has(id) ? "✓ Lida (desmarcar)" : "Marcar como lida"; });
    const nb = $("nextBtn");
    if (nb) nb.addEventListener("click", () => { read.add(id); saveRead(); });
    // índice interno
    const heads = Array.from(document.querySelectorAll("#prose h2"));
    heads.forEach((h, i) => { h.id = "s" + (i + 1); });
    $("rail").innerHTML = heads.length ? `<h4>Nesta nota</h4><ul class="outline">${heads.map(h => `<li><a href="#" data-jump="${h.id}">${esc(h.textContent)}</a></li>`).join("")}</ul><a class="outline-link" href="#" data-jump="conn">Mapa de ligações ↓</a>` : "";
  }

  /* ---------- busca ---------- */
  function search(q) {
    const toks = deacc(q).split(/\s+/).filter(t => t.length > 1);
    if (!toks.length) return [];
    const res = [];
    NOTES.forEach(n => {
      const t = deacc(n.t); let sc = 0, ok = true;
      for (const k of toks) {
        const inT = t.includes(k), c = n.x.split(k).length - 1;
        if (!inT && !c) { ok = false; break; }
        sc += (inT ? 8 : 0) + Math.min(c, 6);
      }
      if (ok) res.push({ n, sc });
    });
    return res.sort((a, b) => b.sc - a.sc);
  }
  function snippet(n, q) {
    const k = deacc(q).split(/\s+/).filter(t => t.length > 1)[0]; if (!k) return "";
    const i = n.x.indexOf(k); if (i < 0) return n.bl || "";
    return (i > 50 ? "…" : "") + n.x.slice(Math.max(0, i - 50), i + 130) + "…";
  }
  function renderSearch() {
    const r = search(lastQuery);
    $("main").innerHTML = `<div class="eyebrow">Busca</div><h1 class="page" style="font-size:1.8rem">“${esc(lastQuery)}”</h1><div class="meta" style="margin-bottom:16px">${r.length} nota(s)</div>${r.slice(0, 40).map(({ n }) => `<a class="result ${theme(n)}" href="#${n.id}"><span class="meta">${KIND[n.k]}</span><br><b>${esc(n.t)}</b><p>${esc(snippet(n, lastQuery))}</p></a>`).join("") || "<p>Nenhuma nota encontrada. Tente uma palavra mais curta.</p>"}`;
    $("rail").innerHTML = "";
  }

  /* ---------- rotas ---------- */
  function route() {
    const h = (location.hash || "").slice(1);
    document.body.classList.remove("menu"); $("menuBtn").setAttribute("aria-expanded", "false");
    let curId = "";
    if (h.startsWith("n-") && byId[h]) { curId = h; renderNote(h); }
    else if (h.startsWith("roteiro-") && modById[h.slice(8)]) renderModule(h.slice(8));
    else if (h === "busca" && lastQuery) renderSearch();
    else renderHome();
    renderSide(curId);
    window.scrollTo(0, 0);
    document.title = curId ? byId[curId].t + " · Guia de Materialismo Histórico" : "Guia de Materialismo Histórico";
  }
  window.addEventListener("hashchange", route);

  /* ---------- eventos ---------- */
  document.addEventListener("click", e => {
    const a = e.target.closest("[data-ctx]"); if (a) { ctx = a.getAttribute("data-ctx"); store.set("mh.ctx", ctx); }
    const t = e.target.closest("[data-tab]"); if (t) { tab = t.getAttribute("data-tab"); store.set("mh.tab", tab); renderSide((location.hash || "").slice(1)); }
    const k = e.target.closest("[data-kind]"); if (k) { kindFilter = k.getAttribute("data-kind"); renderSide((location.hash || "").slice(1)); }
    const j = e.target.closest("[data-jump]"); if (j) { e.preventDefault(); const el = $(j.getAttribute("data-jump")); if (el) el.scrollIntoView({ block: "start" }); }
    if (!e.target.closest(".search")) $("drop").hidden = true;
  });
  $("menuBtn").addEventListener("click", () => { const on = document.body.classList.toggle("menu"); $("menuBtn").setAttribute("aria-expanded", String(on)); });
  $("themeBtn").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.getAttribute("data-theme") === "dark" || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });
  const q = $("q"), drop = $("drop");
  q.addEventListener("input", () => {
    const v = q.value.trim();
    if (v.length < 2) { drop.hidden = true; return; }
    const r = search(v).slice(0, 7);
    drop.innerHTML = r.length ? r.map(({ n }) => `<a href="#${n.id}"><b>${esc(n.t)}</b><small>${KIND[n.k]}</small></a>`).join("") : '<div style="padding:10px;color:var(--muted)">Nada encontrado.</div>';
    drop.hidden = false;
  });
  q.addEventListener("keydown", e => {
    if (e.key === "Enter" && q.value.trim().length > 1) { lastQuery = q.value.trim(); drop.hidden = true; if (location.hash === "#busca") renderSearch(); else location.hash = "busca"; }
    if (e.key === "Escape") { drop.hidden = true; q.blur(); }
  });
  drop.addEventListener("click", () => { drop.hidden = true; q.value = ""; });
  document.addEventListener("keydown", e => {
    if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
    const h = (location.hash || "").slice(1);
    if (e.key === "/") { e.preventDefault(); q.focus(); return; }
    if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && byId[h]) {
      const m = modById[ctx]; if (!m || !m.s.includes(h)) return;
      const i = m.s.indexOf(h) + (e.key === "ArrowRight" ? 1 : -1);
      if (i >= 0 && i < m.s.length) location.hash = m.s[i];
    }
  });
  route();
})();
</script>
